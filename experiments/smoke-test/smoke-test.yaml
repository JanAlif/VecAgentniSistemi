environment:
  name: Pogema-v0
  on_target: restart
  max_episode_steps: 512
  observation_type: POMAPF
  collision_system: soft
  map_name:
    grid_search:
      - test-mazes-s49_wc2_od50
      - test-mazes-s47_wc2_od25
      - test-mazes-s44_wc2_od30
      - test-mazes-s41_wc5_od50
  num_agents:
    grid_search: [32, 64, 128]
  seed:
    grid_search: [0, 1, 2]

algorithms:
  Follower:
    name: Follower
    num_process: 4
    parallel_backend: 'balanced_dask'

  Follower+Corridor:
    name: Follower
    num_process: 4
    parallel_backend: 'balanced_dask'
    override_config:
      preprocessing:
        use_corridor_penalty: True
        corridor_penalty_weight: 1.5

results_views:
  TabularResults:
    type: tabular
    drop_keys: [seed]
    print_results: True